version: '3.8'

services:
  backend:
    build: .
    container_name: nexavoice-backend
    ports:
      - "8000:8000"
    environment:
      # Database connection string mapped to the 'db' service
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nexa_voice
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    container_name: nexavoice-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nexa_voice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
